name: CI

# Автомерж удалён 2026-09-12 по правилу владелицы «мерж — только вручную».
# Канон — docs/rules/core/github-anti-abuse.md.
# Этот workflow только проверяет сборку и тесты; мержит PR кнопкой человек.

# pull_request, не pull_request_target: GitHub блокирует его в публичных репо
# (пробные отключения 9 и 16 ноября, полностью с 2026-12-02). PR идут из веток
# этого же репо, секреты workflow не нужны.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'cursor/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present -- --run
